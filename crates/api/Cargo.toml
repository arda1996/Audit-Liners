[package]
name = "api"
version = "0.1.0"
edition = "2021"
description = "Audit-Liners HTTP API (axum) — domain çekirdeğini web/masaüstüne açar"

[dependencies]
domain = { path = "../domain" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
futures = "0.3"
