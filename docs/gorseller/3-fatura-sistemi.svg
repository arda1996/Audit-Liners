<!-- net borç hesabı -->
<text x="40" y="252" font-size="17" font-weight="700" fill="#16191d">Faturanın gerçek borcu — tahsis motorunun kapatacağı tutar</text>
<rect x="40" y="270" width="1160" height="128" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="62" y="300" font-size="14" font-family="Courier, monospace" fill="#16191d">
  <tspan font-weight="700" fill="#5b21b6">NET BORÇ</tspan>  =  toplam  −  tevkifat  −  iade  −  iskonto
</text>
<text x="62" y="330" font-size="11.5" fill="#475569">• <tspan font-weight="600">tevkifat</tspan> (KDVK 9): alıcı KDV'nin bir kısmını sorumlu sıfatıyla vergi dairesine öder — satıcıya ÖDEMEZ, 391'e yalnız kalan pay yazılır</text>
<text x="62" y="352" font-size="11.5" fill="#475569">• <tspan font-weight="600">iade</tspan> (610): mal geri geldi — 600 ters çevrilmez, 610'a yazılır, 191 BORÇLANIR (KDVK 35 matrah düzeltmesi)</text>
<text x="62" y="374" font-size="11.5" fill="#475569">• <tspan font-weight="600">iskonto</tspan> (611): fatura sonrası ciro primi / erken ödeme iskontosu</text>
<text x="62" y="392" font-size="11" fill="#7c3aed">Hükümsüz belgede (taslak/iptal/red) NET BORÇ = 0 · negatife düşemez</text>

