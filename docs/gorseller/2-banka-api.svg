<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ok" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#64748b"/></marker>
<marker id="okr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#dc2626"/></marker></defs>
<rect width="1240" height="820" fill="#fbfaf8"/>
<text x="40" y="52" font-size="27" font-weight="700" fill="#16191d">2 · Banka API Hattı — paradan kayda</text>
<text x="40" y="78" font-size="14" fill="#64748b">Para CARİYE girer, faturaya değil. Hangi faturayı kapattığını tahsis motoru belirler.</text>

<!-- veri kaynağı -->
<rect x="40" y="110" width="230" height="150" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="155" y="136" font-size="15" font-weight="600" text-anchor="middle" fill="#312e81">AÇIK BANKACILIK</text>
<text x="60" y="162" font-size="11.5" fill="#4338ca">OAuth · ÖHVPS yetkilendirme</text>
<text x="60" y="182" font-size="11.5" fill="#4338ca">salt-okunur hesap erişimi</text>
<text x="60" y="206" font-size="11.5" fill="#334155">/api/banka/oys/hesaplar</text>
<text x="60" y="224" font-size="11.5" fill="#334155">/api/banka/oys/hareketler</text>
<text x="60" y="248" font-size="10.5" fill="#dc2626">şu an SİMÜLASYON — uçlar sabit,</text>

<line x1="270" y1="185" x2="308" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#ok)"/>

<!-- ekstre -->
<rect x="312" y="110" width="230" height="150" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="427" y="136" font-size="15" font-weight="600" text-anchor="middle" fill="#16191d">EKSTRE SATIRI</text>
<text x="332" y="162" font-size="11.5" fill="#475569">tarih · tutar · yön</text>
<text x="332" y="182" font-size="11.5" fill="#475569">açıklama · referans</text>
<text x="332" y="204" font-size="11.5" font-weight="600" fill="#b45309">karşı taraf ÜNVANI</text>
<text x="332" y="228" font-size="11" fill="#b45309">^ eşleşmenin ön koşulu —</text>
<text x="332" y="244" font-size="11" fill="#b45309">yoksa otomatik yapılamaz</text>

<line x1="542" y1="185" x2="580" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#ok)"/>

<!-- tahsilat olayı -->
<rect x="584" y="110" width="250" height="150" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="709" y="136" font-size="15" font-weight="600" text-anchor="middle" fill="#065f46">TAHSİLAT OLAYI</text>
<text x="604" y="160" font-size="12" font-family="Courier, monospace" fill="#047857">THS-1234</text>
<text x="604" y="184" font-size="11.5" fill="#334155">CARİYE aittir — faturaya değil</text>
<text x="604" y="206" font-size="11.5" fill="#334155">Enstrüman: BANKA · NAKİT</text>
<text x="604" y="224" font-size="11.5" fill="#334155">ÇEK · SENET</text>
<text x="604" y="248" font-size="10.5" fill="#059669">Her para bankadan geçmez — banka-dışı</text>

<line x1="834" y1="185" x2="872" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#ok)"/>
<rect x="876" y="110" width="240" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="996" y="136" font-size="15" font-weight="600" text-anchor="middle" fill="#92400e">TAHSİS MOTORU</text>
<text x="896" y="164" font-size="11.5" fill="#a16207">» görsel 4</text>
<text x="896" y="192" font-size="11.5" fill="#334155">Ünvan VAR » otomatik (FIFO)</text>
<text x="896" y="214" font-size="11.5" fill="#334155">Ünvan YOK » maker kuyruğu</text>
<text x="896" y="242" font-size="10.5" fill="#d97706">Ölçüm: 998 hareketin 6'sı (%0,6)</text>

<!-- iki defter -->
<text x="40" y="312" font-size="17" font-weight="700" fill="#16191d">İki ayrı defter — nakit ticaretin gerçeği</text>

<rect x="40" y="330" width="380" height="200" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="62" y="358" font-size="14" font-weight="700" fill="#16191d">102 BANKA</text>
<text x="62" y="384" font-size="11.5" fill="#475569">Ekstre hareketlerinden doğar</text>
<text x="62" y="406" font-size="11.5" fill="#475569">Açılış bakiyesi + giriş − çıkış</text>
<rect x="62" y="422" width="336" height="88" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
<text x="80" y="446" font-size="12" font-weight="700" fill="#b91c1c">! ALACAK bakiye veremez</text>
<text x="80" y="468" font-size="11.5" fill="#334155">Hesapta olmayan para ödenemez.</text>
<text x="80" y="488" font-size="11.5" fill="#334155">Kredili mevduat ise <tspan font-weight="700">300 Banka Kredileri</tspan></text>
<text x="80" y="504" font-size="11.5" fill="#334155">hesabına alınır — 102'de eksi durmaz.</text>

<rect x="440" y="330" width="380" height="200" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="462" y="358" font-size="14" font-weight="700" fill="#16191d">100 KASA</text>
<text x="462" y="384" font-size="11.5" fill="#475569">Nakit tahsilat/ödemelerden doğar</text>
<text x="462" y="406" font-size="11.5" fill="#475569">Bankadan beslenir: <tspan font-family="Courier, monospace">100 B / 102 A</tspan></text>
<rect x="462" y="422" width="336" height="88" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
<text x="480" y="446" font-size="12" font-weight="700" fill="#b91c1c">! NEGATİF kasa = denetim bulgusu</text>
<text x="480" y="468" font-size="11.5" fill="#334155">Fiilen olmayan para ödenmiş demektir:</text>
<text x="480" y="488" font-size="11.5" fill="#334155">kayıt dışı hasılat / eksik belge</text>
<text x="480" y="504" font-size="11.5" fill="#334155">göstergesidir.</text>

<rect x="840" y="330" width="360" height="200" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="862" y="358" font-size="14" font-weight="700" fill="#92400e">TEVSİK ZORUNLULUĞU</text>
<text x="862" y="382" font-size="11.5" fill="#a16207">VUK mükerrer 257</text>
<text x="862" y="406" font-size="11.5" fill="#334155">Haddi aşan tahsilat/ödeme banka veya</text>
<text x="862" y="424" font-size="11.5" fill="#334155">PTT üzerinden yapılmak zorundadır.</text>
<text x="862" y="448" font-size="11.5" fill="#334155">Nakit yapılırsa <tspan font-weight="700">özel usulsüzlük</tspan> riski.</text>
<rect x="862" y="462" width="316" height="52" rx="8" fill="#fff" stroke="#fbbf24"/>
<text x="878" y="484" font-size="11.5" fill="#92400e">Kayıt GEÇERLİDİR ama bulgulanır.</text>
<text x="878" y="503" font-size="11" fill="#a16207">Ölçüm: 971 nakit hareketin 152'si haddi aşıyor</text>

<!-- havada bakiye -->
<text x="40" y="582" font-size="17" font-weight="700" fill="#16191d">Havada bakiye — eşleşmemiş para</text>
<rect x="40" y="600" width="1160" height="150" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="62" y="628" font-size="13" fill="#334155">Bankaya para girmiş ama hiçbir belgeye bağlanmamış. Eşleşene kadar <tspan font-weight="700" fill="#b91c1c">tamlık ihlali / kayıt dışı hasılat riski</tspan> taşır (VUK · BDS 500).</text>

<rect x="62" y="646" width="360" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="80" y="670" font-size="12.5" font-weight="700" fill="#16191d">A) Fatura VAR, eşleşmemiş</text>
<text x="80" y="692" font-size="11.5" fill="#475569">firma seç » açık faturalar » bağla</text>
<text x="80" y="714" font-size="11.5" font-weight="600" fill="#059669">» muhasebe kaydı DOĞAR</text>

<rect x="440" y="646" width="360" height="88" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
<text x="458" y="670" font-size="12.5" font-weight="700" fill="#92400e">B) Fatura HENÜZ KESİLMEMİŞ</text>
<text x="458" y="692" font-size="11.5" fill="#475569">firma seç » "fatura bekleniyor" işaretle</text>
<text x="458" y="714" font-size="11.5" font-weight="600" fill="#b45309">» kayıt DOĞMAZ (VUK 227: belge şart)</text>

<rect x="818" y="646" width="360" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="836" y="670" font-size="12.5" font-weight="700" fill="#16191d">HATIRLATMA</text>
<text x="836" y="692" font-size="11.5" fill="#475569">VUK 231: fatura 7 gün içinde düzenlenir</text>
<text x="836" y="714" font-size="11.5" fill="#b91c1c">Aşınca uyarı üretilir · banka bazında izlenir</text>

<text x="40" y="792" font-size="11.5" fill="#94a3b8">Audit-Liners · banka hattı · /api/havada · /api/simulasyon/kasa · /api/denetim/anomali</text>
</svg>
