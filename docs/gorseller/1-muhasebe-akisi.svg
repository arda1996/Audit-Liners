  <text x="130" y="160" font-size="11.5" text-anchor="middle" fill="#4338ca">e-Fatura · dekont</text>
  <text x="130" y="175" font-size="11.5" text-anchor="middle" fill="#4338ca">makbuz · ekstre</text>

  <rect x="264" y="112" width="180" height="72" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="354" y="140" font-size="15" font-weight="600" text-anchor="middle" fill="#16191d">FİŞ</text>
  <text x="354" y="160" font-size="11.5" text-anchor="middle" fill="#475569">Tahsil · Tediye</text>
  <text x="354" y="175" font-size="11.5" text-anchor="middle" fill="#475569">Mahsup · Açılış</text>

  <rect x="488" y="112" width="180" height="72" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
