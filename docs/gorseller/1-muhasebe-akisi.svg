<!-- iki çıkış -->
<line x1="1026" y1="184" x2="1026" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#ok)"/>
<rect x="880" y="232" width="290" height="86" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="1025" y="257" font-size="14" font-weight="600" text-anchor="middle" fill="#16191d">MALİ TABLOLAR</text>
<text x="1025" y="278" font-size="11.5" text-anchor="middle" fill="#475569">Bilanço · Gelir tablosu</text>
<text x="1025" y="298" font-size="11.5" text-anchor="middle" fill="#475569">600 − 610 − 611 = Net satış</text>

<line x1="1026" y1="318" x2="1026" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#ok)"/>
<rect x="880" y="364" width="290" height="104" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="1025" y="389" font-size="14" font-weight="600" text-anchor="middle" fill="#92400e">BEYANNAME</text>
<text x="1025" y="410" font-size="11.5" text-anchor="middle" fill="#a16207">KDV1 · Geçici · Kurumlar</text>
<text x="1025" y="432" font-size="11" text-anchor="middle" fill="#a16207">defter = TİCARİ kâr</text>
<text x="1025" y="450" font-size="11" text-anchor="middle" fill="#a16207">beyanname = MALİ kâr</text>

<!-- doktrin kutuları -->
<text x="40" y="238" font-size="16" font-weight="700" fill="#16191d">Kaydı belirleyen üç kural</text>

<rect x="40" y="256" width="264" height="150" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="58" y="282" font-size="13.5" font-weight="700" fill="#b91c1c">İPTAL, İADE DEĞİLDİR</text>
<text x="58" y="306" font-size="11.5" fill="#334155">İPTAL: belge hüküm doğurmadı</text>
<text x="58" y="324" font-size="11.5" fill="#334155">» ters kayıt (storno), 600 geri döner</text>
<text x="58" y="348" font-size="11.5" fill="#334155">İADE: mal teslim oldu, geri geldi</text>
<text x="58" y="366" font-size="11.5" fill="#334155">» <tspan font-weight="700">610</tspan> Satıştan İadeler kullanılır</text>
<text x="58" y="390" font-size="11" fill="#dc2626">600 TERS ÇEVRİLMEZ — iade oranı</text>
<text x="58" y="404" font-size="11" fill="#dc2626">denetim göstergesidir</text>

<rect x="320" y="256" width="264" height="150" rx="10" fill="#fff" stroke="#0891b2" stroke-width="1.5"/>
<text x="338" y="282" font-size="13.5" font-weight="700" fill="#0e7490">KAYIT SİLİNMEZ</text>
<text x="338" y="306" font-size="11.5" fill="#334155">VUK 219 · TTK 65</text>
<text x="338" y="330" font-size="11.5" fill="#334155">Asıl kayıt <tspan font-weight="700">İPTAL</tspan> işaretlenir,</text>
<text x="338" y="348" font-size="11.5" fill="#334155">karşısına <tspan font-weight="700">STORNO</tspan> açılır</text>
<text x="338" y="366" font-size="11.5" fill="#334155">(borç/alacak yer değiştirir)</text>
<text x="338" y="390" font-size="11" fill="#0891b2">Net etki sıfır · ikisi de defterde</text>
<text x="338" y="404" font-size="11" fill="#0891b2">Düzeltme KAYIT tarihine atılır</text>

<rect x="600" y="256" width="264" height="150" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="618" y="282" font-size="13.5" font-weight="700" fill="#6d28d9">KDV ORAN KIRILIMI</text>
<text x="618" y="306" font-size="11.5" fill="#334155">Muavin ARDIŞIK: 391.01 · 391.02 …</text>
<text x="618" y="324" font-size="11.5" fill="#334155">Oran koddan OKUNMAZ, katalogdan</text>
<text x="618" y="342" font-size="11.5" fill="#334155">çözülür (%1 · %10 · %20 · istisna)</text>
<text x="618" y="366" font-size="11" fill="#7c3aed">Oran defterde taşınmazsa beyanname</text>
<text x="618" y="380" font-size="11" fill="#7c3aed">matrahı tek orandan hesaplanır</text>
<text x="618" y="398" font-size="11" font-weight="600" fill="#dc2626">» YANLIŞ BEYAN</text>

<!-- örnek kayıt -->
<text x="40" y="452" font-size="16" font-weight="700" fill="#16191d">Örnek — satış faturası ve iptali</text>
<rect x="40" y="470" width="400" height="150" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="60" y="495" font-size="12.5" font-weight="700" fill="#16191d">TAHAKKUK (asıl)</text>
<text x="60" y="522" font-size="12" font-family="Courier, monospace" fill="#334155">120 Alıcılar</text><text x="420" y="522" font-size="12" font-family="Courier, monospace" text-anchor="end" fill="#16191d">B 12.000</text>
<text x="60" y="546" font-size="12" font-family="Courier, monospace" fill="#334155">600 Yurtiçi Satışlar</text><text x="420" y="546" font-size="12" font-family="Courier, monospace" text-anchor="end" fill="#16191d">A 10.000</text>
<text x="60" y="570" font-size="12" font-family="Courier, monospace" fill="#334155">391.06 Hesaplanan KDV %20</text><text x="420" y="570" font-size="12" font-family="Courier, monospace" text-anchor="end" fill="#16191d">A  2.000</text>
<line x1="60" y1="584" x2="420" y2="584" stroke="#cbd5e1"/>
<text x="60" y="604" font-size="11.5" fill="#059669">Σborç 12.000 = Σalacak 12.000</text>

<rect x="470" y="470" width="400" height="150" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
<text x="490" y="495" font-size="12.5" font-weight="700" fill="#b91c1c">STORNO (iptal — ters kayıt)</text>
<text x="490" y="522" font-size="12" font-family="Courier, monospace" fill="#334155">600 Yurtiçi Satışlar</text><text x="850" y="522" font-size="12" font-family="Courier, monospace" text-anchor="end" fill="#16191d">B 10.000</text>
<text x="490" y="546" font-size="12" font-family="Courier, monospace" fill="#334155">391.06 Hesaplanan KDV %20</text><text x="850" y="546" font-size="12" font-family="Courier, monospace" text-anchor="end" fill="#16191d">B  2.000</text>
<text x="490" y="570" font-size="12" font-family="Courier, monospace" fill="#334155">120 Alıcılar</text><text x="850" y="570" font-size="12" font-family="Courier, monospace" text-anchor="end" fill="#16191d">A 12.000</text>
<line x1="490" y1="584" x2="850" y2="584" stroke="#fca5a5"/>
<text x="490" y="604" font-size="11.5" fill="#b91c1c">Net etki 0 · asıl kayıt defterde KALIR</text>

