<rect width="1240" height="820" fill="#fbfaf8"/>
<text x="40" y="52" font-size="27" font-weight="700" fill="#16191d">1 · Muhasebe Akışı — belgeden beyannameye</text>
<text x="40" y="78" font-size="14" fill="#64748b">Her kayıt bir BELGEYE dayanır (VUK 227). Kayıt silinmez; düzeltme ters kayıtla yapılır (VUK 219).</text>

<!-- ana zincir -->
<g>
  <rect x="40" y="112" width="180" height="72" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
