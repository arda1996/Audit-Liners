  <text x="578" y="162" font-size="11.5" text-anchor="middle" fill="#475569">müteselsil · kronolojik</text>
  <text x="578" y="177" font-size="11.5" text-anchor="middle" fill="#475569">geriye tarihlenemez</text>

  <rect x="712" y="112" width="180" height="72" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="802" y="140" font-size="15" font-weight="600" text-anchor="middle" fill="#16191d">KEBİR</text>
  <text x="802" y="162" font-size="11.5" text-anchor="middle" fill="#475569">hesap bazında</text>
  <text x="802" y="177" font-size="11.5" text-anchor="middle" fill="#475569">yürüyen bakiye</text>

  <rect x="936" y="112" width="180" height="72" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
